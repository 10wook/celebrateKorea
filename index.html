<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>태극기</title>
    <style>
        #flagContainer {
            text-align: center;
            margin-top: 50px;
            width: 100%; /* 컨테이너가 화면 너비를 차지하도록 */
            max-width: 100vw; /* 뷰포트 폭 이상 넘지 않도록 */
        }

        #flagContainer img {
            width: 100%;
            max-width: 100%; /* 이미지가 컨테이너를 가득 채우도록 */
            height: auto; /* 비율 유지하면서 자동 조정 */
            object-fit: contain; /* 이미지 비율을 유지하면서 크기 조정 */
        }
    </style>
  </head>
  <body>
    <div id="flagContainer">





        
        <img src="Flag.svg" alt="South Korean Flag">
    </div>
  </body>
</html>
