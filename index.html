<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>태극기</title>
    <style>
        #flagContainer {
            text-align: center;
            margin-top: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        #flagContainer img {
            width: 100%;
            height: auto;
            max-width: min(90vw, 1400px);
            max-height: 80vh;
            object-fit: contain; /* 이미지 비율 유지 + 반응형 크기 */
        }
    </style>
  </head>
  <body>
    <div id="flagContainer">





        
        <img src="Flag.svg" alt="South Korean Flag">
    </div>
    <main id="infoContainer" aria-live="polite">
      <div id="countdown" role="status"></div>
      <div id="annivMessage" hidden></div>
    </main>
    <script defer src="./app.js"></script>
  </body>
</html>
