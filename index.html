<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="함께 광복절의 의미를 되새겨요" />
    <meta property="og:title" content="태극기, 광복절을 기념합니다" />
    <meta property="og:description" content="함께 광복절의 의미를 되새겨요" />
    <meta property="og:image" content="태극기.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="태극기, 광복절을 기념합니다" />
    <meta name="twitter:description" content="함께 광복절의 의미를 되새겨요" />
    <meta name="twitter:image" content="태극기.jpg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>태극기 — 광복절을 기념합니다</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header id="siteHeader">
      <button id="themeToggle" type="button" aria-label="테마 전환">🌙</button>
      <button id="shareBtn" type="button" aria-label="공유하기">공유</button>
    </header>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div id="flagContainer" role="img" aria-label="대한민국 국기가 달린 국기봉">
      <noscript>
        <img src="태극기.jpg" alt="대한민국 국기" />
      </noscript>
    </div>
    <main id="infoContainer" aria-live="polite">
      <div id="flagDayPicker" class="flag-day-picker" role="tablist" aria-label="기념일 선택"></div>
      <div id="flagDayLabel" class="flag-day-label"></div>
      <div id="countdown" role="status"></div>
      <div id="annivMessage" hidden></div>
    </main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script defer src="./app.js"></script>
    <script type="module" src="./countdown.js"></script>
    <script type="module">
      import { initFlagScene } from "./flag-scene.js";
      initFlagScene(document.getElementById("flagContainer"));
    </script>
  </body>
</html>
