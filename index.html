<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>태극기</title>
    <style>
        #flagContainer {
            text-align: center;

            margin-top: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        #flagContainer img {
            width: 100%;
            height: auto;
            max-width: min(90vw, 1400px);
            max-height: 80vh;
            object-fit: contain; /* 이미지 비율 유지 + 반응형 크기 */
        }
        #flagContainer canvas {
            width: 100%;
            height: auto;
            max-width: min(90vw, 1400px);
            max-height: 80vh;
            display: block;
        }
    </style>
  </head>
  <body>
    <div id="flagContainer">






        
        <canvas id="flagCanvas" aria-hidden="true"></canvas>
        <img class="flag" src="태극기.jpg" alt="대한민국 국기" style="width:100%;height:100%;object-fit:contain;" />
    </div>
    <main id="infoContainer" aria-live="polite">
      <div id="countdown" role="status"></div>
      <div id="annivMessage" hidden></div>
    </main>
    <script defer src="./app.js"></script>
  </body>
</html>
