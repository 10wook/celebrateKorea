<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>태극기</title>
    <style>
        #flagContainer {
            text-align: center;
            margin-top: 50px;
        }

        #flagContainer img {
            width: 100%;
            max-width: 90vw; /* 최대 너비를 뷰포트 폭의 90%로 제한 */
            height: auto; /* 비율 유지하면서 자동 조정 */
            object-fit: contain; /* 이미지 비율을 유지하면서 크기 조정 */
        }
    </style>
  </head>
  <body>
    <div id="flagContainer">





        
        <img src="Flag.svg" alt="South Korean Flag">
    </div>
  </body>
</html>
