<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>태극기</title>
    <style>
        #flagContainer {
            text-align: center;
            margin-top: 50px;
            width: 90vw;            /* 화면 폭의 90% 사용 */
            max-width: 900px;        /* 데스크톱에서 너무 커지지 않도록 제한 */
            aspect-ratio: 3 / 2;     /* 태극기 공식 비율 3:2 유지 */
            position: relative;      /* 자식 요소 정렬용 */
        }

    </style>
  </head>
  <body>
    <div id="flagContainer">
        <img src="태극기.jpg" alt="대한민국 국기" style="width:100%;height:100%;object-fit:contain;" />
        </div>
  </body>
</html>
